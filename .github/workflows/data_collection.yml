name: Data Collection

on:
  # GAS からの正確なトリガーに統一
  workflow_dispatch: # 手動実行・外部(GAS)からの実行用

permissions:
  contents: write

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect-data:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        for i in 1 2 3; do python -m pip install --upgrade pip && break || sleep $((i*i)); done
        for i in 1 2 3; do pip install -r requirements.txt && break || sleep $((i*i)); done
        
    - name: Configure git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
    - name: Backfill missing data
      run: |
        echo "Starting backfill process for last 24 hours..."
        for i in 1 2 3; do python scripts/backfill_missing_data.py --hours 24 --max 20 && break || sleep $((i*i)); done || echo "⚠️ Backfill completed with some failures"
        echo "Backfill process completed"
        
    - name: Run data collection
      run: |
        echo "Starting current data collection..."
        for i in 1 2 3; do python scripts/collect_data.py && break || sleep $((i*i)); done
        echo "Data collection completed"
        
    - name: Check for changes
      id: changes
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Commit and push changes
      if: steps.changes.outputs.has_changes == 'true'
      run: |
        git add data/
        git commit -m "📊 Update monitoring data - $(date '+%Y-%m-%d %H:%M:%S UTC')"
        
        # Retry mechanism for merge conflicts
        for attempt in {1..5}; do
          echo "Push attempt $attempt/5..."
          
          if git pull --rebase origin main; then
            if git push; then
              echo "✅ Successfully pushed changes"
              exit 0
            else
              echo "❌ Push failed, retrying..."
            fi
          else
            echo "❌ Rebase failed, resolving conflicts..."
            # Reset and try merge strategy instead
            git rebase --abort || true
            git pull --no-rebase origin main
            
            # If conflicts exist, abort this run to prevent data corruption
            if [[ -n $(git status --porcelain | grep "^UU\|^AA\|^DD") ]]; then
              echo "⚠️ Merge conflicts detected. Aborting to prevent data corruption."
              git merge --abort || true
              exit 1
            fi
            
            if git push; then
              echo "✅ Successfully pushed after merge"
              exit 0
            fi
          fi
          
          # Wait with exponential backoff
          sleep $((attempt * 10))
        done
        
        echo "❌ Failed to push after 5 attempts"
        exit 1
        
    - name: Cleanup on failure
      if: failure()
      run: |
        echo "Data collection failed at $(date)"
        # Optional: Create error log
        echo "$(date): Data collection failed" >> data/error.log || true
